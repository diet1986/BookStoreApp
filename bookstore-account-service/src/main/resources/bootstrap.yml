spring:
  application:
    name: bookstore-account-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

management:
  endpoints:
    web:
      exposure:
        include: "*"

---
spring:
  config:
    activate:
      on-profile: "local,mysql"
  cloud:
    bus:
      enabled: false
    consul:
      enabled: false

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    registerWithEureka: true
    enabled: true
  instance:
    prefer-ip-address: false

management:
  metrics:
    export:
      influx:
        enabled: false

---
spring:
  config:
    activate:
      on-profile: "docker,kubernetes"
  cloud:
    consul:
      host: ${CONSUL_HOST:bookstore-consul-discovery}
      port: ${CONSUL_PORT:8500}
      discovery:
        instanceId: ${spring.application.name}:${random.value}
      enabled: true

eureka:
  client:
    enabled: false
