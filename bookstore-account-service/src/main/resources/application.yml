server:
  port: ${SERVER_PORT:4001}

security:
  jwt:
    key-store: classpath:JWTKeystore.p12
    key-store-password: ${JWT_KEYSTORE_PASSWORD:devdcorespass}
    key-pair-alias: ${JWT_KEY_PAIR_ALIAS:jwt-key}
    key-pair-password: ${JWT_KEY_PAIR_PASSWORD:devdcorespass}
    public-key: classpath:jwt-signing-public-key.txt

spring:
  application:
    name: bookstore-account-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    table: account_service_flyway_history
    baseline-on-migrate: true
    baseline-version: 0.9
  main:
    allow-bean-definition-overriding: true

# Micrometer Tracing replaces Spring Cloud Sleuth
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:${ZIPKIN_PORT:9411}/api/v2/spans
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: bookstore-account-service

logging:
  level:
    com.devd.spring.*: DEBUG

---
# Local profile - uses H2 in-memory DB and Eureka
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude:
      - org.springframework.cloud.consul.serviceregistry.ConsulAutoServiceRegistrationAutoConfiguration
      - org.springframework.cloud.consul.serviceregistry.ConsulServiceRegistryAutoConfiguration
      - org.springframework.cloud.consul.discovery.ConsulDiscoveryClientConfiguration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:bookstore_db;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      path: /h2-console

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    registerWithEureka: true
    enabled: true
  instance:
    prefer-ip-address: false

---
# Docker profile - uses MySQL and Consul
spring:
  config:
    activate:
      on-profile: docker
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        show_sql: false
        format_sql: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:bookstore-mysql-db}:${DB_PORT:3306}/${DB_NAME:bookstore_db}?useUnicode=true&serverTimezone=UTC
    username: ${DB_USER:bookstoreDBA}
    password: ${DB_PASSWORD:PaSSworD}
  cloud:
    consul:
      host: ${CONSUL_HOST:bookstore-consul-discovery}
      port: ${CONSUL_PORT:8500}
      discovery:
        instanceId: ${spring.application.name}:${random.value}
      enabled: true

eureka:
  client:
    enabled: false

management:
  metrics:
    export:
      influx:
        db: bookstore_influxdb_monitoring_metrics
        uri: http://${INFLUX_HOST:bookstore-influxdb}:${INFLUX_PORT:8086}
        auto-create-db: true

---
# Kubernetes / AWS profile - uses MySQL (RDS) and Consul or K8s DNS
spring:
  config:
    activate:
      on-profile: kubernetes
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        show_sql: false
        format_sql: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # DB_HOST injected via K8s ConfigMap/Secret (points to RDS endpoint)
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:bookstore_db}?useUnicode=true&serverTimezone=UTC&useSSL=true&requireSSL=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  cloud:
    consul:
      host: ${CONSUL_HOST:consul}
      port: ${CONSUL_PORT:8500}
      discovery:
        instanceId: ${spring.application.name}:${random.value}
        prefer-ip-address: true
      enabled: true

eureka:
  client:
    enabled: false

management:
  metrics:
    export:
      influx:
        enabled: false
