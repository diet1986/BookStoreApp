---
# Order Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-order-service
  namespace: bookstore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookstore-order-service
  template:
    metadata:
      labels:
        app: bookstore-order-service
    spec:
      containers:
      - name: order-service
        image: REPLACE_WITH_ECR_REGISTRY/bookstore-order-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 7001
        envFrom:
        - configMapRef:
            name: bookstore-config
        - secretRef:
            name: bookstore-secrets
        env:
        - name: SERVER_PORT
          value: "7001"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 7001
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 7001
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-order-service
  namespace: bookstore
spec:
  selector:
    app: bookstore-order-service
  ports:
  - port: 7001
    targetPort: 7001
  type: ClusterIP
