{{- if .Values.zipkin.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: {{ .Values.global.namespace }}
  labels:
    app: zipkin
    {{- include "bookstore.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
      - name: zipkin
        image: {{ .Values.zipkin.image }}:{{ .Values.zipkin.imageTag }}
        ports:
        - containerPort: 9411
        readinessProbe:
          httpGet:
            path: /health
            port: 9411
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: zipkin
    {{- include "bookstore.labels" . | nindent 4 }}
spec:
  selector:
    app: zipkin
  ports:
  - port: 9411
    targetPort: 9411
  type: ClusterIP
{{- end }}
