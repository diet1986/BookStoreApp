---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.apiGateway.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.apiGateway.name }}
    {{- include "bookstore.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.apiGateway.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.apiGateway.name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: api-gateway
        image: {{ include "bookstore.image" (dict "Values" .Values "image" .Values.apiGateway.image) }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.apiGateway.port }}
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: {{ .Values.global.springProfile | quote }}
        - name: SERVER_PORT
          value: {{ .Values.apiGateway.port | quote }}
        - name: CONSUL_HOST
          value: "consul-service"
        - name: CONSUL_PORT
          value: "8500"
        - name: ZIPKIN_HOST
          value: "zipkin-service"
        {{- include "bookstore.readinessProbe" .Values.apiGateway.port | nindent 8 }}
        {{- include "bookstore.livenessProbe" .Values.apiGateway.port | nindent 8 }}
        resources:
          {{- toYaml .Values.apiGateway.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.apiGateway.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.apiGateway.name }}
    {{- include "bookstore.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.apiGateway.name }}
  ports:
  - port: {{ .Values.apiGateway.port }}
    targetPort: {{ .Values.apiGateway.port }}
  type: ClusterIP
